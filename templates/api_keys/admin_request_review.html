{% extends 'base.html' %}

{% block title %}管理员 - 审批申请{% endblock %}

{% block content %}
<div class="card panel-card"><div class="card-body">
    <h3>审批申请：{{ key_request.name }}</h3>
    <p><strong>申请人：</strong>{{ key_request.user.username }}</p>
    <p><strong>原因：</strong>{{ key_request.reason }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary rounded-pill px-4" type="submit">提交审批</button>
    </form>
</div></div>
{% endblock %}
