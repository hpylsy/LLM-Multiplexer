{% extends 'base.html' %}

{% block title %}登录{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card panel-card shadow-lg border-0 login-card">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto mb-3 bg-primary-subtle text-primary"><i class="bi bi-box-arrow-in-right"></i></div>
                    <h3 class="mb-2">登录系统</h3>
                    <p class="text-muted mb-0">进入实验室大模型门户后台</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary w-100 rounded-pill py-2" type="submit">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
